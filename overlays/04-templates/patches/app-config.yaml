apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-rhdh
  namespace: rhdh
data:
  app-config-rhdh.yaml: |
    app:
      title: Red Hat Developer Hub
      baseUrl: https://backstage-developer-hub-rhdh.{{ cluster_subdomain }}

    signInPage: oidc
    auth:
      session:
        secret: ${BACKEND_SECRET}
      environment: production
      providers:
        oidc:
          production:
            prompt: login
            metadataUrl: https://sso.{{ cluster_subdomain }}/realms/backstage/.well-known/openid-configuration
            clientId: ${OAUTH_CLIENT_ID}
            clientSecret: ${OAUTH_CLIENT_SECRET}
            signIn:
              resolvers:
                - resolver: preferredUsernameMatchingUserEntityName

    backend:
      baseUrl: https://backstage-developer-hub-rhdh.{{ cluster_subdomain }}
      listen:
        port: 7007
        host: 0.0.0.0
      auth:
        externalAccess:
          - type: static
            options:
              token: ${BACKEND_SECRET}
              subject: api-access

    integrations:
      gitlab:
        - apiBaseUrl: https://gitlab-gitlab.{{ cluster_subdomain }}/api/v4
          baseUrl: https://gitlab-gitlab.{{ cluster_subdomain }}
          host: gitlab-gitlab.{{ cluster_subdomain }}
          token: ${GITLAB_TOKEN}

    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location, Template, Domain]
      locations:
        - type: url
          target: https://gitlab-gitlab.{{ cluster_subdomain }}/parasol/parasol-store/blob/main/catalog-info.yaml
          rules:
            - allow: [Component, System, API, Resource, Location, Domain]
        - type: url
          target: https://gitlab-gitlab.{{ cluster_subdomain }}/parasol/parasol-store-api/blob/main/catalog-info.yaml
          rules:
            - allow: [Component, System, API, Resource, Location, Domain]
        - type: url
          target: https://gitlab-gitlab.{{ cluster_subdomain }}/parasol/software-templates/blob/main/catalog-info.yaml
          rules:
            - allow: [Template]
      providers:
        keycloakOrg:
          default:
            baseUrl: https://sso.{{ cluster_subdomain }}
            realm: backstage
            loginRealm: backstage
            clientId: ${KEYCLOAK_PLUGIN_CLIENT_ID}
            clientSecret: ${KEYCLOAK_PLUGIN_CLIENT_SECRET}
            schedule:
              frequency: { minutes: 2 }
              timeout: { minutes: 1 }
              initialDelay: { seconds: 15 }
        gitlab:
          gitlab:
            host: gitlab-gitlab.{{ cluster_subdomain }}
            branch: main
            fallbackBranch: main
            entityFilename: catalog-info.yaml
            schedule:
              frequency: { minutes: 5 }
              timeout: { minutes: 3 }

    argocd:
      appLocatorMethods:
        - type: config
          instances:
            - name: main
              url: https://rhdh-gitops-server-rhdh-gitops.{{ cluster_subdomain }}
              username: admin
              password: ${ARGOCD_PASSWORD}

    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - clusters:
            - name: dev-cluster
              url: {{ kubernetes_api_url }}
              authProvider: serviceAccount
              skipTLSVerify: true
              serviceAccountToken: ${KUBERNETES_SA_TOKEN}
          type: config
      customResources:
        - group: tekton.dev
          apiVersion: v1beta1
          plural: pipelineruns
        - group: tekton.dev
          apiVersion: v1beta1
          plural: taskruns
        - group: route.openshift.io
          apiVersion: v1
          plural: routes
