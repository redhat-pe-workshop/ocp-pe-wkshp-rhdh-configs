apiVersion: rhdh.redhat.com/v1alpha5
kind: Backstage
metadata:
  name: developer-hub
  namespace: rhdh
  labels:
    app.kubernetes.io/name: backstage
spec:
  application:
    # Instructs the operator to mount the app-config-rhdh ConfigMap into
    # the Backstage container at /opt/app-root/src/app-config-rhdh.yaml
    appConfig:
      mountPath: /opt/app-root/src
      configMaps:
        - name: app-config-rhdh
    # Instructs the operator to use the dynamic-plugins ConfigMap to configure the Backstage plugins
    dynamicPluginsConfigMapName: dynamic-plugins
    extraFiles:
      mountPath: /opt/app-root/src
    route:
      enabled: true
  deployment:
    # Instructs the operator to mount a PersistentVolumeClaim to cache dynamically
    # installed Backstage plugins to speed up subsequent deployments
    # The dynamic-plugins-root PVC uses ReadWriteOnce. The main container
    # reads plugin bundles from this volume at runtime, so it stays mounted
    # for the pod's lifetime. Recreate avoids multi-attach errors during
    # rollouts since RWO only allows one pod to mount the PVC at a time.
    patch:
      spec:
        strategy:
          $patch: replace
          type: Recreate
        template:
          spec:
            containers:
              - name: backstage-backend
                resources:
                  requests:
                    ephemeral-storage: 1Gi
                  limits:
                    ephemeral-storage: 2Gi
            volumes:
              - $patch: replace
                name: dynamic-plugins-root
                persistentVolumeClaim:
                  claimName: dynamic-plugins-root
  database:
    enableLocalDb: true
